name: Publish GitHub Pages preview assets

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Refresh tracked preview assets
        run: |
          rm -rf preview
          mkdir -p preview
          cp -R dist/. preview/

      - name: Commit preview assets
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update Pages preview"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request legacy Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
